<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tic Tac Toe</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tic Tac Toe">
<meta name="theme-color" content="#f7f8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12232f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@500;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
/* Layout: one screen — a sheet of graph paper with the grid drawn in ink, mode switch and status above, tally below */
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --paper: #f7f8f3;
  --rule: #d6e0e6;
  --ink: #26323a;
  --muted: #6b7a82;
  --x: #1f5fbf;
  --o: #c8402e;
  --hi: #f4d34a66;
  --btn: #26323a;
  --btn-fg: #f7f8f3;
  --chip: #ffffffcc;
  --display: "Gochi Hand", "Comic Sans MS", "Marker Felt", cursive;
  --body: "Nunito", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12232f; --rule: #1f3a4c; --ink: #e3ecf0; --muted: #8fa5b1;
    --x: #7fb6ff; --o: #ff8a73; --hi: #f4d34a33; --btn: #e3ecf0; --btn-fg: #12232f;
    --chip: #12232fcc;
    color-scheme: dark;
  }
}
html { height: 100%; background: var(--paper); }
body {
  margin: 0;
  height: 100%;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.wrap {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.seg {
  display: flex; padding: 3px; border-radius: 999px;
  border: 2px solid var(--ink); background: var(--chip);
}
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--ink);
  font-family: var(--body); font-weight: 700; font-size: .95rem;
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }
.seg.small { border-width: 1.5px; }
.seg.small button { font-size: .82rem; padding: 6px 12px; }
.seg button:focus-visible { outline: 3px solid var(--x); outline-offset: 2px; }

.status {
  font-family: var(--display);
  font-size: clamp(2rem, 9vw, 2.75rem);
  line-height: 1.1;
  text-align: center;
  min-height: 1.2em;
  margin: 0;
}
.status .x { color: var(--x); }
.status .o { color: var(--o); }
.status.done { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }

.board {
  position: relative;
  width: min(84vw, 420px, 52vh);
  aspect-ratio: 1;
  max-width: 100%;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
}
.board svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.grid path { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.cell {
  appearance: none; border: 0; background: transparent; padding: 10%;
  cursor: pointer; border-radius: 10px; position: relative;
  transition: background-color .2s;
}
.cell:focus-visible { outline: 3px solid var(--x); outline-offset: -6px; }
.cell.win { background: var(--hi); }
.cell:disabled { cursor: default; }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cell svg path {
  fill: none; stroke-linecap: round; stroke-width: 9;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: draw .28s ease-out forwards;
}
.cell svg .x { stroke: var(--x); }
.cell svg .x2 { animation-delay: .14s; }
.cell svg .o { stroke: var(--o); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.board.over .cell:not(.win) svg { opacity: .35; transition: opacity .3s; }

.tally {
  display: flex; gap: 28px; justify-content: center;
  font-family: var(--display); font-size: 1.4rem;
}
.tally div { display: flex; flex-direction: column; align-items: center; line-height: 1; gap: 4px; }
.tally span { font-family: var(--body); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.tally .xs { color: var(--x); }
.tally .os { color: var(--o); }
.tally b { font-variant-numeric: tabular-nums; font-weight: 400; font-size: 1.8rem; }

.actions { display: flex; gap: 12px; }
button.btn {
  font-family: var(--body); font-weight: 700; font-size: 1rem;
  border-radius: 999px; padding: 12px 24px; cursor: pointer;
  border: 2px solid var(--btn); background: var(--btn); color: var(--btn-fg);
}
button.btn.ghost { background: transparent; color: var(--ink); }
button.btn:focus-visible { outline: 3px solid var(--x); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .cell svg path { animation: none; stroke-dashoffset: 0; }
  .status.done { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <div class="seg" role="group" aria-label="Game mode">
      <button type="button" id="modeCpu" aria-pressed="false">vs Computer</button>
      <button type="button" id="modeTwo" aria-pressed="false">2 Players</button>
    </div>
    <div class="seg small" id="levels" role="group" aria-label="Difficulty">
      <button type="button" data-level="medium" aria-pressed="false">Medium</button>
      <button type="button" data-level="hard" aria-pressed="false">Hard</button>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="board" id="board" role="grid" aria-label="Tic tac toe board">
    <svg class="grid" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M101 8 C99 90 102 200 100 292"/>
      <path d="M199 6 C201 100 198 210 200 293"/>
      <path d="M8 100 C90 102 210 98 292 101"/>
      <path d="M7 200 C100 198 200 202 293 199"/>
    </svg>
  </div>

  <div class="tally" aria-label="Score">
    <div class="xs"><b id="sx">0</b><span id="lx">X wins</span></div>
    <div><b id="sd">0</b><span>Draws</span></div>
    <div class="os"><b id="so">0</b><span id="lo">O wins</span></div>
  </div>

  <div class="actions">
    <button class="btn" id="newGame" type="button">New game</button>
    <button class="btn ghost" id="resetScore" type="button">Reset score</button>
  </div>
</div>

<script>
(function () {
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var HUMAN = 'X', CPU = 'O';
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var levelsEl = document.getElementById('levels');
  var cells = [];
  var board, turn, over, starter = 'X';
  var cpuTimer = null;

  // Settings and scores (scores kept separately for each mode/difficulty)
  var settings = { mode: 'cpu', level: 'medium' };
  var scores = {};
  try {
    var s = JSON.parse(localStorage.getItem('ttt-settings') || 'null');
    if (s && (s.mode === 'cpu' || s.mode === 'two')) settings.mode = s.mode;
    var sc = JSON.parse(localStorage.getItem('ttt-scores') || 'null');
    if (sc && typeof sc === 'object') scores = sc;
    // Version 6 replaced all computer levels with Medium and Hard; computer scores start fresh
    if (!localStorage.getItem('ttt-levels-v6')) {
      if (s) s.level = s.level === 'unbeatable' ? 'hard' : 'medium';
      Object.keys(scores).forEach(function (k) { if (k.indexOf('cpu-') === 0) delete scores[k]; });
      localStorage.setItem('ttt-levels-v6', '1');
      localStorage.setItem('ttt-scores', JSON.stringify(scores));
      if (s) localStorage.setItem('ttt-settings', JSON.stringify(s));
    }
    if (s && ['medium', 'hard'].indexOf(s.level) !== -1) settings.level = s.level;
    var old = JSON.parse(localStorage.getItem('ttt-score') || 'null');
    if (old && typeof old.X === 'number' && !scores.two) scores.two = old;
  } catch (e) {}

  function scoreKey() { return settings.mode === 'two' ? 'two' : 'cpu-' + settings.level; }
  function score() {
    var k = scoreKey();
    if (!scores[k] || typeof scores[k].X !== 'number') scores[k] = { X: 0, O: 0, D: 0 };
    return scores[k];
  }
  function save() {
    try {
      localStorage.setItem('ttt-settings', JSON.stringify(settings));
      localStorage.setItem('ttt-scores', JSON.stringify(scores));
    } catch (e) {}
  }

  for (var i = 0; i < 9; i++) {
    var c = document.createElement('button');
    c.className = 'cell';
    c.type = 'button';
    c.id = 'cell' + i;
    c.dataset.i = i;
    c.addEventListener('click', onTap);
    boardEl.appendChild(c);
    cells.push(c);
  }

  function winnerOf(b) {
    for (var k = 0; k < LINES.length; k++) {
      var l = LINES[k];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], line: l };
    }
    return null;
  }

  function emptySquares(b) {
    var out = [];
    for (var k = 0; k < 9; k++) if (!b[k]) out.push(k);
    return out;
  }

  // Can anyone still get three in a row, playing out every possible remaining move?
  function winPossible(b, t) {
    if (winnerOf(b)) return true;
    for (var k = 0; k < 9; k++) {
      if (!b[k]) {
        b[k] = t;
        var r = winPossible(b, t === 'X' ? 'O' : 'X');
        b[k] = null;
        if (r) return true;
      }
    }
    return false;
  }

  // ---------- Computer player ----------
  function other(p) { return p === 'X' ? 'O' : 'X'; }

  function minimax(b, t, me, depth) {
    var w = winnerOf(b);
    if (w) return w.p === me ? 10 - depth : depth - 10;
    var empties = emptySquares(b);
    if (!empties.length) return 0;
    var best = t === me ? -Infinity : Infinity;
    for (var k = 0; k < empties.length; k++) {
      b[empties[k]] = t;
      var v = minimax(b, other(t), me, depth + 1);
      b[empties[k]] = null;
      best = t === me ? Math.max(best, v) : Math.min(best, v);
    }
    return best;
  }

  function bestMove(b, me) {
    var empties = emptySquares(b);
    var bestVal = -Infinity, choices = [];
    for (var k = 0; k < empties.length; k++) {
      b[empties[k]] = me;
      var v = minimax(b, other(me), me, 1);
      b[empties[k]] = null;
      if (v > bestVal) { bestVal = v; choices = [empties[k]]; }
      else if (v === bestVal) choices.push(empties[k]);
    }
    return pick(choices);
  }

  function finishingMove(b, p) {
    var empties = emptySquares(b);
    for (var k = 0; k < empties.length; k++) {
      b[empties[k]] = p;
      var w = winnerOf(b);
      b[empties[k]] = null;
      if (w) return empties[k];
    }
    return -1;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // Hard plays perfectly except that in about 1 game out of 10 it makes one
  // mistake: a move that lets you force a win, preferring subtle ones (a fork
  // setup) over leaving an open win.
  var SLIP_CHANCE = 0.10;
  var slipThisGame = false;

  function losingMove(b) {
    var empties = emptySquares(b), subtle = [], obvious = [];
    for (var k = 0; k < empties.length; k++) {
      b[empties[k]] = CPU;
      if (!winnerOf(b) && minimax(b, HUMAN, CPU, 1) < 0) {
        (finishingMove(b, HUMAN) === -1 ? subtle : obvious).push(empties[k]);
      }
      b[empties[k]] = null;
    }
    if (subtle.length) return pick(subtle);
    if (obvious.length) return pick(obvious);
    return -1;
  }

  function cpuChoose() {
    var b = board.slice();
    var empties = emptySquares(b);
    if (settings.level === 'hard') {
      if (slipThisGame) {
        var slip = losingMove(b);
        if (slip !== -1) { slipThisGame = false; return slip; }
      }
      return bestMove(b, CPU);
    }
    // Chance of taking a win, blocking your win, and otherwise playing the best move
    var STYLE = {
      medium: { win: 1, block: 1, best: 0.85 }
    };
    var st = STYLE[settings.level] || STYLE.medium;
    var win = finishingMove(b, CPU);
    if (win !== -1 && Math.random() < st.win) return win;
    var block = finishingMove(b, HUMAN);
    if (block !== -1 && Math.random() < st.block) return block;
    if (Math.random() < st.best) return bestMove(b, CPU);
    return pick(empties);
  }

  // ---------- Drawing ----------
  function mark(p) {
    if (p === 'X') {
      return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
        '<path class="x" pathLength="1" d="M18 16 C40 40 60 62 84 85"/>' +
        '<path class="x x2" pathLength="1" d="M83 15 C60 38 40 60 16 84"/></svg>';
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<path class="o" pathLength="1" d="M52 14 C76 14 88 32 87 52 C86 74 70 87 50 87 C28 87 13 72 13 50 C13 30 28 15 54 17"/></svg>';
  }

  function setStatus(html, done) {
    statusEl.innerHTML = html;
    statusEl.classList.remove('done');
    if (done) { void statusEl.offsetWidth; statusEl.classList.add('done'); }
  }

  function vsCpu() { return settings.mode === 'cpu'; }

  function showTurn() {
    if (vsCpu()) {
      setStatus(turn === HUMAN ? 'Your turn <span class="x">(X)</span>' : '<span class="o">Thinking…</span>', false);
    } else {
      setStatus('<span class="' + turn.toLowerCase() + '">' + turn + '</span>’s turn', false);
    }
  }

  function renderScore() {
    var sc = score();
    document.getElementById('sx').textContent = sc.X;
    document.getElementById('so').textContent = sc.O;
    document.getElementById('sd').textContent = sc.D;
    document.getElementById('lx').textContent = vsCpu() ? 'You' : 'X wins';
    document.getElementById('lo').textContent = vsCpu() ? 'Computer' : 'O wins';
  }

  function renderControls() {
    document.getElementById('modeCpu').setAttribute('aria-pressed', String(vsCpu()));
    document.getElementById('modeTwo').setAttribute('aria-pressed', String(!vsCpu()));
    levelsEl.hidden = !vsCpu();
    Array.prototype.forEach.call(levelsEl.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.level === settings.level));
    });
  }

  function lockBoard(locked) {
    cells.forEach(function (c, k) { c.disabled = locked || !!board[k]; });
  }

  function finish() {
    over = true;
    boardEl.classList.add('over');
    cells.forEach(function (c) { c.disabled = true; });
  }

  // ---------- Game flow ----------
  function play(i) {
    board[i] = turn;
    cells[i].innerHTML = mark(turn);
    cells[i].disabled = true;
    cells[i].setAttribute('aria-label', turn);

    var w = winnerOf(board);
    if (w) {
      w.line.forEach(function (k) { cells[k].classList.add('win'); });
      score()[w.p]++;
      finish();
      if (vsCpu()) setStatus(w.p === HUMAN ? '<span class="x">You win!</span>' : '<span class="o">Computer wins</span>', true);
      else setStatus('<span class="' + w.p.toLowerCase() + '">' + w.p + '</span> wins!', true);
    } else {
      turn = other(turn);
      if (!winPossible(board.slice(), turn)) {
        score().D++;
        finish();
        setStatus('Draw — nobody can win', true);
      } else {
        showTurn();
        if (vsCpu() && turn === CPU) cpuTurn();
        else lockBoard(false);
      }
    }
    save();
    renderScore();
  }

  function cpuTurn() {
    lockBoard(true);
    cpuTimer = setTimeout(function () {
      cpuTimer = null;
      if (over || turn !== CPU) return;
      play(cpuChoose());
    }, 550);
  }

  function onTap(e) {
    var i = +e.currentTarget.dataset.i;
    if (over || board[i]) return;
    if (vsCpu() && turn !== HUMAN) return;
    play(i);
  }

  function newGame() {
    if (cpuTimer) { clearTimeout(cpuTimer); cpuTimer = null; }
    board = [null, null, null, null, null, null, null, null, null];
    slipThisGame = settings.level === 'hard' && Math.random() < SLIP_CHANCE;
    turn = starter;
    starter = other(starter);
    over = false;
    boardEl.classList.remove('over');
    cells.forEach(function (c, k) {
      c.innerHTML = '';
      c.disabled = false;
      c.classList.remove('win');
      c.setAttribute('aria-label', 'Empty square ' + (k + 1));
    });
    showTurn();
    if (vsCpu() && turn === CPU) cpuTurn();
  }

  function setMode(m) {
    if (settings.mode === m) return;
    settings.mode = m;
    starter = 'X';
    save(); renderControls(); renderScore(); newGame();
  }

  document.getElementById('modeCpu').addEventListener('click', function () { setMode('cpu'); });
  document.getElementById('modeTwo').addEventListener('click', function () { setMode('two'); });
  Array.prototype.forEach.call(levelsEl.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () {
      if (settings.level === b.dataset.level) return;
      settings.level = b.dataset.level;
      starter = 'X';
      save(); renderControls(); renderScore(); newGame();
    });
  });
  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('resetScore').addEventListener('click', function () {
    scores[scoreKey()] = { X: 0, O: 0, D: 0 };
    save();
    renderScore();
  });

  // ---------- Auto-update ----------
  // Bump APP_VERSION here and in version.json together on every release.
  var APP_VERSION = '6';
  var pendingVersion = null;

  function gameInProgress() {
    return !over && board.some(function (v) { return v; });
  }

  function applyUpdate(v) {
    var tried = null;
    try { tried = sessionStorage.getItem('ttt-update-tried'); } catch (e) {}
    if (tried === v) return; // already reloaded for this version once; don't loop
    try { sessionStorage.setItem('ttt-update-tried', v); } catch (e) {}
    location.replace(location.pathname + '?v=' + encodeURIComponent(v));
  }

  function checkForUpdate() {
    if (!window.fetch) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.version || String(data.version) === APP_VERSION) return;
        var v = String(data.version);
        if (gameInProgress()) pendingVersion = v; // wait until this game is over
        else applyUpdate(v);
      })
      .catch(function () {});
  }

  document.getElementById('newGame').addEventListener('click', function () {
    if (pendingVersion) applyUpdate(pendingVersion);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkForUpdate();
  });

  renderControls();
  renderScore();
  newGame();
  checkForUpdate();
})();
</script>
</body>
</html>
